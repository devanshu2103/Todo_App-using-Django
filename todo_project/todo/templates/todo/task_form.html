<!DOCTYPE html>
<html>
<head>
    <title>Task Form</title>
</head>
<body>
    <h1>{% if task %}Edit{% else %}Add{% endif %} Task</h1>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Title" value="{{ task.title|default:'' }}" required>
        <textarea name="description" placeholder="Description">{{ task.description|default:'' }}</textarea>
        {% if task %}
        <input type="checkbox" name="completed" {% if task.completed %}checked{% endif %}> Completed
        {% endif %}
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'task_list' %}">Back</a>
</body>
</html>
